<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Admin – Laporan Jalan Rusak</title>
 
<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Firebase v8.10.1 — wajib di <head>, sebelum script utama -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
 
<style>
  :root{
    --ink:#1d2733; --muted:#6b7683; --line:#dfe3e8; --paper:#f6f4ef; --panel:#ffffff;
    --berat:#d62839; --sedang:#f2b705; --ringan:#2e9e5b;
  }
  html,body{height:100%;margin:0;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
  .app{display:flex;height:100vh;width:100%}
  .sidebar{width:30%;min-width:320px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);z-index:1000}
  .map-wrap{width:70%;position:relative}
  #map{position:absolute;inset:0}
 
  .head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
  .head h1{font-size:1.1rem;font-weight:700;margin:0}
  .head small{color:var(--muted)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
  .live i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
  .live.on i{background:var(--ringan);box-shadow:0 0 0 3px rgba(46,158,91,.2)}
 
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .stat{border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:6px;padding:8px 12px;background:#fff}
  .stat .n{font-size:1.6rem;font-weight:700;line-height:1.1}
  .stat .l{font-size:.78rem;color:var(--muted)}
  .stat.total{grid-column:1/-1;border-left-color:var(--ink)}
  .stat.berat{border-left-color:var(--berat)}
  .stat.sedang{border-left-color:var(--sedang)}
  .stat.ringan{border-left-color:var(--ringan)}
 
  .table-box{flex:1;overflow:auto}
  table{margin:0;font-size:.85rem}
  thead th{position:sticky;top:0;background:#fafafa;z-index:2;font-weight:600;border-bottom:1px solid var(--line)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f1f5f9}
  tbody tr.active{background:#fff4d6}
  .badge-k{display:inline-block;padding:2px 9px;border-radius:20px;color:#fff;font-size:.72rem;font-weight:600}
  .badge-k.Berat{background:var(--berat)}
  .badge-k.Sedang{background:var(--sedang);color:#3b2f00}
  .badge-k.Ringan{background:var(--ringan)}
  .empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:.9rem}
 
  /* marker */
  .pin{width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .pin.Berat{background:var(--berat)} .pin.Sedang{background:var(--sedang)} .pin.Ringan{background:var(--ringan)}
 
  /* popup */
  .leaflet-popup-content{margin:12px;width:220px !important}
  .pop img{width:100%;height:140px;object-fit:cover;border-radius:6px;background:#e9ecef;margin-bottom:8px}
  .pop .noimg{height:90px;display:flex;align-items:center;justify-content:center;background:#e9ecef;border-radius:6px;color:var(--muted);font-size:.8rem;margin-bottom:8px}
  .pop h6{margin:0 0 2px;font-weight:700}
  .pop p{margin:0 0 8px;font-size:.8rem;color:var(--muted)}
 
  @media (max-width:768px){
    .app{flex-direction:column-reverse}
    .sidebar,.map-wrap{width:100%}
    .sidebar{height:50%;min-width:0}
    .map-wrap{height:50%}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="head d-flex justify-content-between align-items-start">
      <div>
        <h1>Laporan Jalan Rusak</h1>
        <small>Dashboard admin</small>
      </div>
      <span class="live" id="live"><i></i><span id="liveText">Menghubungkan…</span></span>
    </div>
 
    <div class="stats">
      <div class="stat total"><div class="n" id="sTotal">0</div><div class="l">Total belum selesai</div></div>
      <div class="stat berat"><div class="n" id="sBerat">0</div><div class="l">Berat</div></div>
      <div class="stat sedang"><div class="n" id="sSedang">0</div><div class="l">Sedang</div></div>
      <div class="stat ringan" style="grid-column:1/-1"><div class="n" id="sRingan">0</div><div class="l">Ringan</div></div>
    </div>
 
    <div class="table-box">
      <table class="table table-sm align-middle">
        <thead><tr><th class="ps-3">Nama jalan</th><th>Jenis</th><th>Keparahan</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">Belum ada laporan yang perlu ditangani.</div>
    </div>
  </aside>
 
  <main class="map-wrap"><div id="map"></div></main>
</div>
 
<script>
/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBXQa_G5jy1foM5HV-gAHXZFe_6zmwAmCA",
  authDomain: "lapor-jalan-4cb5e.firebaseapp.com",
  projectId: "lapor-jalan-4cb5e",
  storageBucket: "lapor-jalan-4cb5e.firebasestorage.app",
  messagingSenderId: "517951226001",
  appId: "1:517951226001:web:982548bea78130bbaf7f30"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
 
/* ============ PETA ============ */
const map = L.map('map').setView([-7.0051, 110.4381], 12); // default: Semarang, otomatis menyesuaikan data
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);
 
const markers = {};   // id -> L.marker
const reports = {};   // id -> data
let firstLoad = true;
 
/* ============ HELPER ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 
// Toleran terhadap variasi nama field di Firestore
function normalize(id, d){
  let lat = d.latitude ?? d.lat ?? d.koordinat?.latitude ?? d.lokasi?.latitude ?? d.location?.latitude;
  let lng = d.longitude ?? d.lng ?? d.lon ?? d.koordinat?.longitude ?? d.lokasi?.longitude ?? d.location?.longitude;
  lat = parseFloat(lat); lng = parseFloat(lng);
  let foto = d.foto ?? d.fotoBase64 ?? d.foto_base64 ?? d.gambar ?? d.image ?? '';
  if (foto && !/^data:|^https?:/i.test(foto)) foto = 'data:image/jpeg;base64,' + foto;
  return {
    id, lat, lng, foto,
    nama: d.namaJalan ?? d.nama_jalan ?? d.nama ?? 'Tanpa nama',
    jenis: d.jenis ?? d.jenisKerusakan ?? d.jenis_kerusakan ?? '-',
    keparahan: d.keparahan ?? 'Ringan',
    status: d.status ?? 'Belum Selesai'
  };
}
 
function makeIcon(k){
  return L.divIcon({
    className:'', html:`<div class="pin ${esc(k)}"></div>`,
    iconSize:[24,24], iconAnchor:[12,24], popupAnchor:[0,-26]
  });
}
 
function popupHtml(r){
  return `<div class="pop">
    ${r.foto ? `<img src="${r.foto}" alt="Foto jalan rusak">` : `<div class="noimg">Tidak ada foto</div>`}
    <h6>${esc(r.nama)}</h6>
    <p>${esc(r.jenis)} · ${esc(r.keparahan)}</p>
    <button class="btn btn-success btn-sm w-100" onclick="tandaiSelesai('${r.id}')">Tandai Selesai</button>
  </div>`;
}
 
/* ============ REAL-TIME LISTENER ============ */
db.collection('laporan_jalan').onSnapshot(snap => {
  setLive(true);
  Object.keys(reports).forEach(k => delete reports[k]);
  snap.forEach(doc => {
    const r = normalize(doc.id, doc.data());
    if (r.status !== 'Selesai') reports[doc.id] = r;
  });
  render();
}, err => {
  console.error(err);
  setLive(false, 'Gagal memuat');
  document.getElementById('empty').style.display = 'block';
  document.getElementById('empty').textContent = 'Gagal membaca data: ' + err.message;
});
 
function setLive(on, text){
  document.getElementById('live').classList.toggle('on', on);
  document.getElementById('liveText').textContent = text || (on ? 'Real-time' : 'Terputus');
}
 
/* ============ RENDER ============ */
function render(){
  const list = Object.values(reports);
 
  // hapus marker yang sudah tidak ada
  Object.keys(markers).forEach(id => {
    if (!reports[id]) { map.removeLayer(markers[id]); delete markers[id]; }
  });
 
  // tambah / perbarui marker
  list.forEach(r => {
    if (isNaN(r.lat) || isNaN(r.lng)) return;
    if (markers[r.id]) { map.removeLayer(markers[r.id]); }
    markers[r.id] = L.marker([r.lat, r.lng], {icon: makeIcon(r.keparahan)})
      .addTo(map).bindPopup(popupHtml(r));
  });
 
  // statistik
  const c = k => list.filter(r => r.keparahan === k).length;
  document.getElementById('sTotal').textContent  = list.length;
  document.getElementById('sBerat').textContent  = c('Berat');
  document.getElementById('sSedang').textContent = c('Sedang');
  document.getElementById('sRingan').textContent = c('Ringan');
 
  // tabel (Berat → Sedang → Ringan)
  const order = {Berat:0, Sedang:1, Ringan:2};
  list.sort((a,b) => (order[a.keparahan] ?? 3) - (order[b.keparahan] ?? 3));
  document.getElementById('tbody').innerHTML = list.map(r => `
    <tr data-id="${r.id}">
      <td class="ps-3">${esc(r.nama)}</td>
      <td>${esc(r.jenis)}</td>
      <td><span class="badge-k ${esc(r.keparahan)}">${esc(r.keparahan)}</span></td>
    </tr>`).join('');
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  if (!list.length) document.getElementById('empty').textContent = 'Belum ada laporan yang perlu ditangani.';
 
  // pertama kali: arahkan peta ke semua marker
  if (firstLoad && Object.keys(markers).length) {
    map.fitBounds(L.featureGroup(Object.values(markers)).getBounds().pad(0.2), {maxZoom: 16});
    firstLoad = false;
  }
}
 
/* ============ KLIK BARIS → flyTo ============ */
document.getElementById('tbody').addEventListener('click', e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  const r = reports[tr.dataset.id]; if (!r || isNaN(r.lat)) return;
  document.querySelectorAll('#tbody tr').forEach(x => x.classList.remove('active'));
  tr.classList.add('active');
  map.flyTo([r.lat, r.lng], 18, {duration: 1.2});
  map.once('moveend', () => markers[r.id]?.openPopup());
});
 
/* ============ TANDAI SELESAI ============ */
async function tandaiSelesai(id){
  if (!confirm('Tandai laporan ini sebagai selesai?')) return;
  try {
    await db.collection('laporan_jalan').doc(id).update({status: 'Selesai'});
    if (markers[id]) { map.removeLayer(markers[id]); delete markers[id]; }
    delete reports[id];
    render();
  } catch (err) {
    alert('Gagal memperbarui status: ' + err.message);
  }
}
</script>
</body>
</html>
